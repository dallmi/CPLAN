[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profitability"
version = "0.1.0"
description = "Convert cost drivers into percentage distributions and allocate costs exactly to the cent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Dall" }]

[project.scripts]
profitability = "profitability.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["profitability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
